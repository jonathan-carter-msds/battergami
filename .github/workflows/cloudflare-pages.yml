name: Deploy site to Cloudflare Pages

# Publishes site/ to the "battergami" Cloudflare Pages project on every push
# to main. Requires two repo secrets (set via `gh secret set`, never
# committed): CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID.
# Free tier: 500 builds/month, no credit system -- this repo uses ~30/month.

on:
  push:
    branches: ["main"]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      deployments: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Deploy to Cloudflare Pages
        uses: cloudflare/pages-action@v1
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          projectName: battergami
          directory: site
          branch: main
